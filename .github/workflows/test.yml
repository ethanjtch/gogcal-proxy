name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 测试不依赖任何 npm 包（只 stub globalThis.fetch），因此不装依赖
      - run: node --test tests/*.test.js
